projects:
- id: pr-01-ai-pro-suite
  title: AI Pro Suite
  context: RIWA GmbH / GovTech
  role: Produkt- und AI-Entwicklung, Entscheidungsunterstützung
  problem: Tickets, Freitext, Surveys, Reports sowie Support-, Field-Feedback- und Sales-Signale lagen verstreut vor und waren schwer in priorisierte Produktentscheidungen übersetzbar.
  approach: Lokale Python-/Streamlit-App mit pandas, LangChain, Ollama, Chat-Oberfläche, qualitativer Pain-Point-Analyse und deterministischer KPI-Auswertung, erweitert um einen BigQuery-basierten Workspace mit Hybrid-RAG-Chat, Ingestion-Pipeline, staging-sicheren Uploads und privacy-gated Cloud-Synthese.
  result: Datenbasierte Priorisierung, AI-gestützte Entscheidungsunterstützung und eine gemeinsame Entscheidungsgrundlage für Customer Intelligence, Markt-/Segmentanalyse und Priorisierung.
  supports_roles:
  - ai_product_manager
  - technical_product_manager
  - product_transformation_lead
  - product_operations
  evidence_strength: strong
- id: pr-03-valueflow
  title: valueflow / Kanban Prioritization Tool
  context: eigene Tool-Entwicklung
  role: Builder
  problem: HiPPO- und Bauchgefühl-Priorisierung.
  approach: Offline-/clientseitiges Priorisierungstool mit Drag-and-drop, gewichteter Bewertung und AI-gestützter Entscheidungsunterstützung.
  result: Sichtbare Zielkonflikte und transparentere Roadmap-Entscheidungen.
  supports_roles:
  - product_operations
  - agile_coach
  - product_transformation_lead
  evidence_strength: strong
  repo_url: https://github.com/GABS10304/valueflow
- id: pr-04-organizational-fit-diagnostics
  title: Organizational Fit Diagnostics
  context: FIS / SAP-Consulting
  role: Modellierer und Diagnostiker
  problem: Reality-Gaps zwischen Strategie, Teamrealität, Stress, Klarheit und Arbeitsweise.
  approach: Bewertungs- und Diagnoseansatz mit neutralen Empfehlungen; Stacey Matrix; Team-/Stakeholder-Umfragen.
  result: Passgenauere Transformations- und Steuerungsentscheidungen.
  supports_roles:
  - agile_coach
  - agile_transformation_consultant
  - product_transformation_lead
  evidence_strength: strong
  repo_url: https://github.com/GABS10304/organizational-fit-diagnostics
- id: pr-05-weidmueller-lead-gen-proof
  title: Weidmüller Lead-Gen Proof
  context: Weidmüller GTI Software GmbH
  role: Product-/Marketing-/Growth-Umsetzung
  problem: Lead-Akquisition in Industrie-Software war unklar bzw. unterschätzt.
  approach: Digitale Lead-Gen, Konfiguratoren, Landingpages, Kampagnen und Webinare.
  result: Nachweis, dass digitale Lead-Akquisition in der Branche funktioniert; Lead-Gen-Produkt bleibt öffentlich verfügbar.
  supports_roles:
  - product_transformation_lead
  - client_solutions_lead
  evidence_strength: medium
- id: pr-06-youparts-pivot-case
  title: Youparts Pivot Case
  context: Youparts Germany
  role: Gründer / Pivot-Verantwortlicher
  problem: On-demand-Lieferung ohne Lagerbestand funktionierte nicht wie gedacht.
  approach: Pivot auf die Vermarktung freier Lieferantenkapazitäten.
  result: Strategischer Geschäftsmodellwechsel.
  supports_roles:
  - product_transformation_lead
  - b2b_saas_govtech_product_lead
  evidence_strength: medium
- id: pr-07-job-fit-system
  title: job-fit-system (Agentic-AI-Bewerbungsassistent)
  context: Eigenes Tool-Projekt (privates Repo, Python/FastAPI, gebaut mit Claude
    Code)
  role: Alleiniger Entwickler
  problem: Stellensuche und individuell zugeschnittene Bewerbungsunterlagen pro
    Stelle zu schreiben, skaliert nicht neben einer Vollzeitrolle.
  approach: Deterministische Fit-Engine gleicht Master-CV gegen Stellenanzeigen
    ab (kein Erfinden von Fakten), automatisiertes Sourcing über mehrere
    Jobbörsen mit täglichem Lauf, API-gestützte Anschreiben-Generierung mit
    strukturiertem Output und Human-in-the-Loop-Freigabe vor jedem Versand.
  result: Aus Stellenanzeige und Master-CV entsteht in Minuten ein individuell
    zugeschnittenes, faktengeprüftes Bewerbungspaket (Anschreiben + CV).
  supports_roles:
  - ai_product_manager
  - technical_product_manager
  evidence_strength: strong
