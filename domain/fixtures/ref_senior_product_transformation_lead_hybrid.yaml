title: Senior Product & Transformation Lead
created: "2026-07-19"
source: manuell bestätigt (Hybrid durch Nutzer)
notes:
  - Produktnahe Grauzone: Ownership implizit, nicht explizit.
  - remote_first_hybrid_ok: Hybrid → passed.
  - Ranking: product_transformation_lead vor agile_project_lead trotz niedrigerem Roh-Score.

job_description: |
  Senior Product & Transformation Lead
  Ort: Hybrid
  Für ein wachsendes B2B-SaaS-/GovTech-Umfeld suchen wir eine Person, die Produktanforderungen aus Kundenfeedback, Support-Tickets und internen Stakeholdern strukturiert ableitet, priorisiert und gemeinsam mit Engineering umsetzt.

  Aufgaben
  Produkt- und Change-Themen aus verschiedenen Quellen zusammenführen.
  Kundenfeedback, Support-Signale und interne Anforderungen bewerten.
  Prioritäten mit Engineering, Delivery, Sales, Support und Management abstimmen.
  Produktentscheidungen nachvollziehbar dokumentieren.
  Prozesse und Zusammenarbeit im Team kontinuierlich verbessern.
  Kleine Transformationen begleiten, ohne reine Coaching-Rolle zu sein.

  Profil
  Erfahrung in Product Management, Product Operations oder Product Transformation.
  Gute Fähigkeit, zwischen Produkt, Koordination und Transformation zu wechseln.
  Sicher im Stakeholder-Management.
  Stark in Analyse, Priorisierung und klarer Kommunikation.
  Praktische Erfahrung mit SaaS-, B2B- oder GovTech-Kontexten von Vorteil.

