# Open-topics lexicon: requirement topics that job descriptions ask for.
#
# For every new sourcing hit (strong pass AND watchlist), the daily shortlist
# lists topics the JD mentions but domain/cv_master.yaml doesn't — and asks
# Gabby whether he has experience there. Answers go into the Master-CV, so
# it grows exactly where the market asks. (Rule from the Skalar case, Okt 2026:
# "no evidence in the CV" is a question, not a gap.)
#
# This is NOT scoring input — V3 stays frozen. Pure reporting layer.
#
# Fields:
#   label:     shown in the shortlist
#   question:  optional; default "Hast du Erfahrung mit <label>?"
#   phrases:   matched case-insensitively with word boundaries in JD text
#   cv_phrases: optional; what counts as "already in the CV" (default: phrases)
#
# Add topics freely; keep phrases specific (no generic words like "markt").

topics:
  evals:
    label: Evals / LLM-Evaluation
    question: Hast du Evals aufgebaut oder genutzt (Testsets, LLM-as-Judge, Metriken)?
    phrases: [evals, eval, evaluation framework, evaluation frameworks, llm-as-judge, llm as a judge, eval-set, eval set, evaluierung, offline evaluation]

  prompt_engineering:
    label: Prompt Engineering / Prompt-Iteration
    phrases: [prompt engineering, prompt-engineering, prompt iteration, prompt-iteration, prompt-iterationen, prompting, prompts]
    cv_phrases: [prompt engineering, prompt-engineering, prompt iteration, prompt-iteration, prompting, prompts, prompt]

  rag:
