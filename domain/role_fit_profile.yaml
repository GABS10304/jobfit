# Role-Fit-Profil – Zielrollen und Kernsignale für den Fit-Check.
# Echte Profildaten (Stand: Import).

version: "0.1"

roles:
  - role_id: ai_product_manager
    role_name: Product Manager / AI Product Manager
    priority: high
    confidence_score: 95
    summary: >
      Starker Fit durch Product Discovery, AI-Use-Case-Validierung, datenbasierte Produktentscheidungen
      und verantwortungsvolle AI-Nutzung in regulierten Kontexten.
    evidence_level: strong
    confidence_notes: >
      Sehr gut belegt durch RIWA, AI Pro Suite, MCP/RAG-Prototyping, Ticket- und Suchdatenanalyse,
      Pilotkunden-Validierung und DSGVO-konforme Analytics-Prozesse.
    core_signals_skills:
      - product_discovery
      - ai_use_case_validation
      - mvp_validation
      - data_driven_decision_making
      - stakeholder_communication
      - product_analytics
      - requirements_engineering
      - experimental_validation
      - privacy_by_design
    core_signals_domains:
      - b2b_saas
      - govtech
      - regulated_environments
      - enterprise_software
      - customer_intelligence
    # Required tools empty: CV-stack tools are optional (Option A′ / Sprint 9).
    # Unmatched optional tools do not inflate the score denominator.
    core_signals_tools: []
    optional_signals_tools:
      - sql
      - python
      - pandas
      - streamlit
      - langchain
      - ollama
      - bigquery
      - mcp
      - claude_desktop
      - jira_product_discovery
    supporting_evidence:
      - project_name: RIWA - AI-nahe Produktarbeit
        reason: Agentic-AI-Use-Cases mit Stakeholdern entwickelt, mit Pilotkunden verifiziert und in Entscheidungs- und Datenprodukte übersetzt.
      - project_name: RIWA - Ticket- und Suchdatenanalyse
        reason: Fehlerbilder identifiziert und priorisierte Anforderungen für intelligente Suche abgeleitet.
      - project_name: AI Pro Suite
        reason: Lokale Python/Streamlit/LangChain/Ollama-Umgebung für DSGVO-konforme Analyse von Tickets, Freitexten und Reports.
      - project_name: GovTech Analytics
        reason: Analytics-Prozesse mit Datenschutzbeauftragten und Engineering aufgebaut.
      - project_name: MCP / Claude-Desktop Prototyping
        reason: Feasibility-first-Validierung von AI-Use-Cases mit MCP-Prototypen und Claude Desktop (belegt in cv_master).
    example_projects:
      - project_name: RIWA - AI-nahe Produktarbeit
        employer_or_client: RIWA
        short_reason: Produktentscheidungen im GovTech-Kontext mit Daten- und AI-Bezug.
      - project_name: AI Pro Suite
        employer_or_client: RIWA
        short_reason: AI-gestütztes Portal für evidenzbasierte PM-Entscheidungen.
    match_patterns_positive:
      - AI Product Manager
      - AI/ML-powered features
      - evaluate and prioritize AI use cases
      - data-driven product decisions
      - responsible AI
      - product analytics
      - discovery and validation
      - regulated environment
    match_patterns_negative:
      - pure project manager with no product ownership
      - feature implementation without discovery
      - AI hype without validation
    best_fit_contexts:
      - regulated B2B SaaS
      - GovTech
      - enterprise AI initiatives
      - data-heavy product teams
    notes: >
      Besonders interessant bei echter Produktverantwortung, AI-Use-Case-Validierung und enger Zusammenarbeit mit Data/Engineering.

  - role_id: technical_product_manager
    role_name: Technical Product Manager
    priority: high
    confidence_score: 92
    summary: >
      Fit durch technische Anschlussfähigkeit, Prototyping, Datenanalyse und die Übersetzung zwischen Business, Produkt und Engineering.
    evidence_level: strong
    confidence_notes: >
      Sehr gut belegt durch Prototypen, Datenanalysen, technische Produktarbeit und direkte Zusammenarbeit mit Software-Leads.
    core_signals_skills:
      - technical_product_management
      - requirements_engineering
      - prototyping
      - backlog_management
      - translation_business_to_tech
      - technical_scoping
      - product_analytics
      - solution_design
    core_signals_domains:
      - b2b_saas
      - platform_products
      - govtech
      - enterprise_software
      - search_products
    # Same Option A′ as ai_product_manager: stack tools optional for JD scoring.
    core_signals_tools: []
    optional_signals_tools:
      - sql
      - python
      - pandas
      - bigquery
      - streamlit
      - langchain
      - jira_product_discovery
      - mcp
      - ollama
    supporting_evidence:
      - project_name: RIWA - Anforderungen aus Ticket- und Suchdaten
        reason: Anforderungen in umsetzungsreife Arbeitspakete übersetzt und mit Software-Leads diskutiert.
      - project_name: AI Pro Suite
        reason: Technische Prototypen aufgebaut, um Produktideen und AI-Workflows schnell zu validieren.
      - project_name: FIS - Jira Product Discovery
        reason: Produktzentriertes Portfolio-Backbone eingeführt.
    example_projects:
      - project_name: Streamlit / LangChain Prototypen
        employer_or_client: RIWA / eigene Tools
        short_reason: Schnelles technisches Validieren von Ideen.
      - project_name: BigQuery-Analysen
        employer_or_client: RIWA
        short_reason: Data-Analytics als Grundlage für Produktentscheidungen.
    match_patterns_positive:
      - Technical Product Manager
      - bridge between business and engineering
      - own technical roadmap
      - work closely with engineering
      - prototype and validate
      - product analytics
    match_patterns_negative:
      - no access to engineering team
      - purely administrative product coordination
      - architecture-only role without product impact
    best_fit_contexts:
      - platform products
      - data products
      - AI-enabled products
      - enterprise software
    notes: >
      Technische Tiefe sollte in Produktgestaltung münden, nicht nur in Schnittstellenverwaltung.

