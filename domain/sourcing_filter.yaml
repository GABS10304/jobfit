# Default sourcing filter contract for fetched job descriptions.
# Used by scripts/fetch_jd.py and scripts/fetch_jobs_batch.py (--fit-check).
# Layer only: does not change V3 fit-engine scoring or status_flag logic.
#
# Pass rules after fit-check (all must hold) — "strong match":
# 1) status_flag not in exclude list and in include list (no_go always out)
# 2) top_score >= min_top_score (aligned with constraints min_score_for_review=75)
# 3) if require_product_role: top_role_id matches product family (substring/allowlist)
# 4) title must not contain any title_deny_keywords (case-insensitive)
#
# Watchlist (optional, scripts/fetch_jobs_batch.py --include-weak-proceed):
# - Same gates as pass except score: proceed/verify + product role + no title deny
# - top_score present and < min_top_score → bucket "watchlist" (NOT passed)
# - Does not lower min_top_score; useful when boards surface product titles with weak V3 scores
# - Optional CV path: --cv-from-watchlist writes labeled weak-match markdown via
#   selection_plan + generate_cv_variant (out/cv_watchlist; strong passed stays separate)
#
# Title prefilter (before fit-check):
# - Prefer allow_keywords match → keep
# - Else deny_keywords hit → skip (reject_reason=title_prefilter)
# - Else require product_keywords match → keep; otherwise skip
# Shared deny list: title_prefilter.deny_keywords falls back to default_pass.title_deny_keywords

default_pass:
  exclude_status_flags:
    - no_go
  include_status_flags:
    - proceed
    - verify_product_ownership
  # Same bar as domain/constraints.yaml → application_rules.min_score_for_review
  # Strong-match bar only — do not lower for weak product titles; use watchlist instead.
  min_top_score: 75
  # Prefer product-tier roles from role_fit_profile (role_id contains "product", etc.)
  require_product_role: true
  product_role_id_substrings:
    - product
  # Optional explicit allowlist in addition to substring match
  product_role_ids: []
  # Obvious non-target titles (engineering / claims / expert roles)
  title_deny_keywords:
    - engineer
    - entwickler
    - fullstack
    - full stack
    - software developer
    - sachverständiger
    - schadenprüfer
    - schaden
    - backend
    - frontend

watchlist:
  # Surfaced only when batch uses --include-weak-proceed
  enabled: true
  # Eligibility mirrors default_pass status/product/title gates; score must be < min_top_score

title_prefilter:
  enabled: true
  # Role phrases that should enter fit-check even on noisy portfolio boards
  allow_keywords:
    - product manager
    - produktmanager
    - product owner
    - produktowner
    - product lead
    - produkt lead
    - ai product
    - technical product
    - head of product
    - director of product
  # Broader product signal when allowlist misses (still subject to deny)
  product_keywords:
    - product
    - produkt
  # Optional override; empty → reuse default_pass.title_deny_keywords
  deny_keywords: []

notes:
  - "verify_product_ownership may pass only with min_top_score + product top role."
  - "Presence exception_denied maps to status_flag=no_go and is excluded."
  - "title_deny_keywords are a sourcing guardrail; extend in YAML without touching V3."
  - "title_prefilter runs before fit-check; --limit applies after prefilter."
  - "watchlist is not a pass; min_top_score stays 75 for strong match."
  - "watchlist CVs: --cv-from-watchlist / scripts/run_watchlist_cv.py (labeled weak-match)."
